body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
body[data-t=dark]{--bg:#262421;--pn:#302e2b;--pn2:#3b3936;--tx:#f2f2f2;--dm:#b3b1ae;--ln:#464441}
body[data-t=light]{--bg:#ebe9e6;--pn:#fff;--pn2:#f2f1ef;--tx:#1f1e1c;--dm:#5f5d59;--ln:#d6d4d0}
body[data-b=green]{--bl:#eeeed2;--bd:#769656}body[data-b=brown]{--bl:#f0d9b5;--bd:#b58863}body[data-b=blue]{--bl:#dee3e6;--bd:#8ca2ad}
*{box-sizing:border-box}h1,h2,h3{margin:.2em 0}
button{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
/* ---- Logo: halftone king used as a background image everywhere ---- */
.logo{width:46px;height:46px;flex:none;border-radius:10px;background:var(--logo) 50% 45%/118% no-repeat #2b2b2b}
.logo.big{width:120px;height:120px;border-radius:18px}
.logo.sm{width:34px;height:34px;border-radius:8px}
/* ---- Header and navigation ---- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;padding:.5rem 1rem;padding-top:calc(.5rem + env(safe-area-inset-top,0px));background:var(--pn);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin-right:auto;cursor:pointer}
nav{display:flex;gap:.2rem}
nav button{background:none;border:0;color:var(--dm);padding:.5rem .8rem;border-radius:8px;font-weight:600}
nav button:hover,nav button.on{background:var(--pn2);color:var(--tx)}
#vbtn{background:var(--pn2);border:0;border-radius:8px;padding:.45rem .7rem;color:var(--tx)}
/* ---- Layout ---- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:1.5rem;max-width:1200px;margin:0 auto;padding:1rem;align-items:start}
.bcol{width:100%;max-width:min(100%,calc(100vh - 130px));justify-self:end}
.page{max-width:1000px;margin:0 auto;padding:1.2rem}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:1rem;box-shadow:0 2px 8px #0003}
.side{display:flex;flex-direction:column;gap:.8rem}
.coach{display:flex;gap:.8rem;align-items:flex-start;border-color:var(--g)}
.coach p{margin:.2rem 0 0;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 0}
.btn{background:var(--g);color:#10210a;border:0;border-bottom:4px solid var(--g2);border-radius:10px;padding:.6rem 1.2rem;font-weight:800}
.btn:disabled{opacity:.4;cursor:default}
.bt{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:.45rem .9rem;font-weight:600}
.bt.on{border-color:var(--g);color:var(--g)}
.stat{margin:.5rem 0 0;color:var(--dm);min-height:1.5em}
.prog{height:8px;background:var(--pn2);border-radius:5px;overflow:hidden;margin:.5rem 0}.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .4s}
.hero{display:flex;gap:1.2rem;align-items:center;margin-bottom:1.2rem}
.hero p{color:var(--dm);margin:.3rem 0 .8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.les .ic{font-size:2.4rem;line-height:1}.les small{color:var(--g);font-weight:700}.les p{color:var(--dm);min-height:3em}
.mvs{margin-top:.6rem;color:var(--dm);max-height:6em;overflow:auto}
textarea{width:100%;margin-top:.5rem;background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:.5rem;font:13px monospace}
.evb{height:14px;background:#222;border-radius:7px;overflow:hidden;margin:.5rem 0 .2rem}.evb i{display:block;height:100%;width:50%;background:#fff;transition:width .3s}
.form label{display:flex;gap:.8rem;align-items:center;margin:.8rem 0}
select{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:.3rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.8rem}
.bg{text-align:center;padding:.8rem;border-radius:12px;background:var(--pn2);opacity:.35}.bg.on{opacity:1;border:1px solid var(--g)}.bg span{font-size:2rem}
/* ---- Board ---- */
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1/1;container-type:size;border-radius:6px;overflow:hidden;box-shadow:0 6px 24px #0007;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden}
.sq.l{background:var(--bl)}.sq.d{background:var(--bd)}
.sq.lm::before,.sq.sel::before,.sq.hl::before{content:"";position:absolute;inset:0;background:#f5f55d88}
.sq.hl::before{background:#4da3ffaa}
.sq.h::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#0003}
.sq.c::after{content:"";position:absolute;inset:3%;border-radius:50%;border:4px solid #0003}
.sq.chk{background:radial-gradient(circle,#f33 0,#c22 50%,transparent 80%),var(--bl)}
.sq s,.sq u{position:absolute;font:700 11px/1 system-ui;text-decoration:none;opacity:.8}
.sq s{top:3px;left:4px}.sq u{bottom:3px;right:4px}
.sq.l s,.sq.l u{color:var(--bd)}.sq.d s,.sq.d u{color:var(--bl)}
.pc{position:relative;z-index:1;font-size:10.5cqw;line-height:1;cursor:grab;font-family:"Segoe UI Symbol","Noto Sans Symbols 2",serif}
.pc.w{color:#fff;-webkit-text-stroke:1.2px #1a1a1a;text-shadow:0 2px 3px #0007}
.pc.b{color:#171614;-webkit-text-stroke:1px #8a8a8a}

<div id="splash"><div class="logo big"></div>Chesstery</div>

<main id="app"></main>
<script>
const $=id=>document.getElementById(id);
const V={p:1,n:3,b:3,r:5,q:9,k:0},NM={p:"pawn",n:"knight",b:"bishop",r:"rook",q:"queen",k:"king"};
const G={k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟︎"};
const col=p=>p?(p<"a"?"w":"b"):null,sqn=i=>"abcdefgh"[i&7]+(8-(i>>3)),nm=p=>NM[p.toLowerCase()],cap=s=>s[0].toUpperCase()+s.slice(1);
const KN=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]],OR=[[1,0],[-1,0],[0,1],[0,-1]],DG=[[1,1],[1,-1],[-1,1],[-1,-1]],AL=OR.concat(DG);
const st=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const init=()=>{const b=Array(64).fill("");"rnbqkbnr".split("").forEach((p,i)=>{b[i]=p;b[56+i]=p.toUpperCase();b[8+i]="p";b[48+i]="P"});return{b,t:"w",cr:"KQkq",ep:-1}};
function att(b,sq,by){const r=sq>>3,c=sq&7,w=by=="w",P=w?"P":"p",N=w?"N":"n",K=w?"K":"k",pr=w?r+1:r-1;
 for(const dx of[-1,1])if(st(pr,c+dx)&&b[pr*8+c+dx]==P)return 1;
 for(const[a,d]of KN)if(st(r+a,c+d)&&b[(r+a)*8+c+d]==N)return 1;
 for(const[a,d]of AL)if(st(r+a,c+d)&&b[(r+a)*8+c+d]==K)return 1;
 for(const[ds,set]of[[OR,w?"RQ":"rq"],[DG,w?"BQ":"bq"]])for(const[a,d]of ds){let y=r+a,x=c+d;while(st(y,x)){const p=b[y*8+x];if(p){if(set.includes(p))return 1;break}y+=a;x+=d}}
 return 0}
function gen(s){const{b,t,cr,ep}=s,w=t=="w",o=[];
 for(let i=0;i<64;i++){const p=b[i];if(!p||col(p)!=t)continue;const k=p.toLowerCase(),r=i>>3,c=i&7;
  const add=(to,x)=>o.push({f:i,t:to,p,c:b[to],...x});
  if(k=="p"){const d=w?-1:1,y=r+d,pm=y==0||y==7?{pr:1}:{};
   if(st(y,c)&&!b[y*8+c]){add(y*8+c,pm);if(r==(w?6:1)&&!b[(y+d)*8+c])add((y+d)*8+c,{dp:1})}
   for(const dx of[-1,1])if(st(y,c+dx)){const to=y*8+c+dx;if(b[to]&&col(b[to])!=t)add(to,pm);else if(to==ep)add(to,{e:1})}}
  else if(k=="n"||k=="k"){for(const[a,d]of k=="n"?KN:AL)if(st(r+a,c+d)){const to=(r+a)*8+c+d;if(col(b[to])!=t)add(to)}
   if(k=="k"&&i==(w?60:4)&&!att(b,i,w?"b":"w")){const e=w?"b":"w",rw=w?56:0;
    if(cr.includes(w?"K":"k")&&!b[rw+5]&&!b[rw+6]&&!att(b,rw+5,e)&&!att(b,rw+6,e))add(rw+6,{ca:1});
    if(cr.includes(w?"Q":"q")&&!b[rw+1]&&!b[rw+2]&&!b[rw+3]&&!att(b,rw+3,e)&&!att(b,rw+2,e))add(rw+2,{ca:1})}}
  else for(const[a,d]of k=="r"?OR:k=="b"?DG:AL){let y=r+a,x=c+d;while(st(y,x)){const to=y*8+x;if(b[to]){if(col(b[to])!=t)add(to);break}add(to);y+=a;x+=d}}}
 return o}
function mk(s,m){const b=s.b.slice(),w=s.t=="w";let cr=s.cr;
 b[m.t]=m.pr?(w?(m.pq||"Q"):(m.pq||"Q").toLowerCase()):m.p;b[m.f]="";
 if(m.e)b[(m.f>>3)*8+(m.t&7)]="";
 if(m.ca){const rw=w?56:0;if((m.t&7)==6){b[rw+5]=b[rw+7];b[rw+7]=""}else{b[rw+3]=b[rw];b[rw]=""}}
 const R={63:"K",56:"Q",7:"k",0:"q"};[m.f,m.t].forEach(x=>{if(R[x])cr=cr.replace(R[x],"")});
 if(m.p=="K")cr=cr.replace(/[KQ]/g,"");if(m.p=="k")cr=cr.replace(/[kq]/g,"");
 return{b,t:w?"b":"w",cr,ep:m.dp?(m.f+m.t)/2:-1}}
const inChk=(s,t=s.t)=>att(s.b,s.b.indexOf(t=="w"?"K":"k"),t=="w"?"b":"w");
const legal=s=>gen(s).filter(m=>!inChk(mk(s,m),s.t));
function ev(s){let v=0;for(let i=0;i<64;i++){const p=s.b[i];if(!p)continue;const k=p.toLowerCase(),r=i>>3,c=i&7,w=p<"a";
 let x=V[k]*100;const cb=8-(Math.abs(r-3.5)+Math.abs(c-3.5));
 x+=cb*(k=="p"||k=="n"?4:k=="b"||k=="q"?2:0);if(k=="p")x+=(w?6-r:r-1)*3;v+=w?x:-x}return v}
function ab(s,d,a,b){if(!d)return(s.t=="w"?1:-1)*ev(s);const L=legal(s);if(!L.length)return inChk(s)?-99999-d:0;
 const sc=m=>m.c?V[m.c.toLowerCase()]*10-V[m.p.toLowerCase()]:0;L.sort((x,y)=>sc(y)-sc(x));
 let best=-1e9;for(const m of L){const v=-ab(mk(s,m),d-1,-b,-a);if(v>best)best=v;if(v>a)a=v;if(a>=b)break}return best}
const scoreMoves=(s,d,n=0)=>legal(s).map(m=>({m,v:-ab(mk(s,m),d-1,-1e9,1e9)+(Math.random()-.5)*n})).sort((a,b)=>b.v-a.v);


function san(s,m){if(m.ca)return(m.t&7)==6?"O-O":"O-O-O";const k=m.p.toUpperCase();let o="";
 if(k!="P"){o=k;const a=legal(s).filter(x=>x.p==m.p&&x.t==m.t&&x.f!=m.f);if(a.length)o+=a.some(x=>(x.f&7)==(m.f&7))?(a.some(x=>(x.f>>3)==(m.f>>3))?sqn(m.f):8-(m.f>>3)):"abcdefgh"[m.f&7]}
 else if(m.c||m.e)o="abcdefgh"[m.f&7];
 if(m.c||m.e)o+="x";o+=sqn(m.t);if(m.pr)o+="="+(m.pq||"Q");
 const a=mk(s,m);if(inChk(a))o+=legal(a).length?"+":"#";return o}

/*T1*/
/* ---- FEN helpers ---- */
const sqi=n=>(8-+n[1])*8+"abcdefgh".indexOf(n[0]);
function fen(f){const[p,t="w",c="-",e="-"]=f.split(/\s+/),b=[];p.split("/").forEach(r=>{for(const ch of r)/\d/.test(ch)?b.push(...Array(+ch).fill("")):b.push(ch)});
 if(b.length!=64||!b.includes("K")||!b.includes("k"))throw 0;return{b,t:t=="b"?"b":"w",cr:c=="-"?"":c,ep:e=="-"?-1:sqi(e)}}
const toFen=s=>{const o=[];for(let r=0;r<8;r++){let l="",n=0;for(let c=0;c<8;c++){const p=s.b[r*8+c];if(p){if(n)l+=n;n=0;l+=p}else n++}if(n)l+=n;o.push(l)}return o.join("/")+" "+s.t+" "+(s.cr||"-")+" "+(s.ep<0?"-":sqn(s.ep))+" 0 1"};
/* ---- Curriculum: step = [fen, spoken prompt, correct moves ("mate"/"check"/[uci]) or null, praise, hint, animation] ---- */
const LS=[
{id:"pieces",ic:"♞",lv:"Absolute beginner",t:"How the pieces move",d:"Meet all six pieces and move each one.",
 intro:"Welcome! I am Coach King. Chess has six kinds of pieces, and each one moves in its own way. We will meet them one at a time. Take your time.",
 sum:"Wonderful! You have met the pawn, rook, bishop, knight, queen and king. Next, we learn how to capture and how a game is won.",
 steps:[
 ["4k3/8/8/8/8/8/4P3/4K3 w","This is the pawn. Think of it as a foot soldier. It marches forward one square, or two on its first move. Move the pawn two squares forward.",["e2e4"],"Perfect! Pawns only go forward, never back.","Click the pawn on e2 and move it to e4, two squares straight ahead."],
 ["4k3/8/8/8/8/8/8/R3K3 w","The rook moves in straight lines, like a train on tracks. Slide the rook up to a5.",["a1a5"],"Nice! Rooks slide any distance along rows and columns.","Slide the rook straight up the board to a5."],
 ["4k3/8/8/8/8/8/8/2B1K3 w","The bishop slides diagonally, and it always stays on the same color. Move it to h6.",["c1h6"],"Great! Bishops love long diagonals.","Slide the bishop along the diagonal up and to the right, all the way to h6."],
 ["4k3/8/8/8/8/8/8/1N2K3 w","The knight jumps in an L shape, like a hopping horse. It is the only piece that can jump over others. Jump to c3.",["b1c3"],"Excellent! Two squares one way, then one to the side.","From b1, go up two squares and one to the right. That lands on c3."],
 ["4k3/8/8/8/8/8/8/3QK3 w","The queen is your strongest piece. She moves like a rook and a bishop together. Move her up to d5.",["d1d5"],"Great! The queen goes anywhere in a straight line.","Slide the queen straight up the board to d5."],
 ["4k3/8/8/8/8/8/8/4K3 w","The king takes one small step in any direction. He is precious: if he is trapped, you lose. Step the king forward one square.",["e1e2"],"Good! Slow and careful is how a king moves.","Move the king one square forward, to e2."]]},
{id:"rules",ic:"⚔️",lv:"Absolute beginner",t:"Capture, check and checkmate",d:"Win pieces, defend your king, and finish the game.",
 intro:"Now let us learn how a game is really won. We will capture, give check, and find checkmate.",
 sum:"Great work! You know captures, check, checkmate and stalemate. Next, we learn tactics that win material.",
 steps:[
 ["4k3/8/8/3p4/8/2N5/8/4K3 w","To capture, move onto an enemy piece and it is removed. The black pawn on d5 is not protected. Capture it with your knight.",["c3d5"],"Captured! Always check whether a piece is protected before you take it.","Jump your knight to d5, where the black pawn stands."],
 ["4k3/8/8/8/8/8/8/R3K3 w","Check means a king is under attack. Give check with your rook.","check","That is check! The black king must respond right away.","Slide the rook so it attacks the black king. Try a8."],
 ["4k3/8/8/8/8/8/4r3/4K3 w","Now you are in check! When that happens, you can move away, block, or capture the attacker. Here, capture the rook.",["e1e2"],"Smart! Nothing protected the rook, so the king could simply take it.","Your king can capture the rook right next to it, on e2."],
 ["6k1/5ppp/8/8/8/8/5PPP/R5K1 w","Checkmate means the king is attacked and cannot escape. That wins the game! The black king is boxed in by his own pawns. Find the checkmate.","mate","Checkmate! The king is attacked, and every escape square is blocked.","Slide your rook all the way to a8."],
 ["7k/5Q2/6K1/8/8/8/8/8 b","One more rule. This is stalemate. It is Black’s turn, the king is not in check, but he has no legal move. That is a draw, not a win. Be careful when you are far ahead."]]},
{id:"tactics",ic:"🎯",lv:"Basic tactics",t:"Forks, pins and skewers",d:"Three tricks that win material.",
 intro:"Tactics are short tricks that win material. We will learn three famous ones: the fork, the pin, and the skewer.",
 sum:"Brilliant! Forks attack two things, pins freeze a piece, and skewers force a big piece to move. Look for them every game.",
 steps:[
 ["r3k3/8/8/1N6/8/8/8/4K3 w","A fork is when one piece attacks two things at once, like a fork spearing two peas. Your knight can attack the king and the rook together. Find the fork.",["b5c7"],"Knight to c7 forks the king and the rook. Black must save the king, so you win the rook.","Jump the knight to c7."],
 ["4k3/3n4/8/8/8/8/4B3/4K3 w","A pin freezes a piece, because moving it would expose something more valuable behind it. Pin the black knight to its king with your bishop.",["e2b5"],"The knight cannot move without exposing the king to check. It is pinned.","Place the bishop on b5, in line with the knight and the king."],
 ["3k2q1/8/8/8/8/8/8/R3K3 w","A skewer is a pin in reverse. A valuable piece is attacked first and must move, exposing a piece behind it. Check the king with your rook, and look behind him.",["a1a8"],"The king must move, and then your rook captures the queen on g8.","Slide the rook to a8, giving check along the back row."]]},
{id:"open",ic:"🚪",lv:"Opening principles",t:"Start the game well",d:"Control the center, develop pieces, castle early.",
 intro:"A good start makes the whole game easier. There are three simple rules for the opening. Let us practice them.",
 sum:"Remember the three rules: control the center, develop your pieces, and castle early. That alone beats many beginners.",
 steps:[
 ["rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq","Rule one: fight for the center. Think of it as the high ground in a battle. Push a center pawn two squares: e4 or d4.",["e2e4","d2d4"],"Excellent! Your pawn controls the center and opens lines for your bishop and queen.","Move the pawn in front of your king, or the one in front of your queen, two squares forward."],
 ["rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq","Rule two: develop your pieces. Bring knights and bishops out so they can join the fight. Develop a knight toward the center.",["g1f3","b1c3"],"Great! Knights belong near the center, where they control more squares.","Move a knight out, to f3 or c3."],
 ["r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq","Keep developing. Bring out a bishop where it points at the center. Try c4.",["f1c4","f1b5"],"Nice! That bishop now eyes the f7 square and the center.","Move the bishop on f1 diagonally out, to c4."],
 ["r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq","Rule three: castle early. This tucks your king behind pawns and brings a rook toward the center. Castle by moving the king two squares toward the rook.",["e1g1"],"Castled! Your king is much safer now, and your rook is ready to join in.","Click your king and move it two squares to the right, to g1."]]},
{id:"mates",ic:"👑",lv:"Common checkmates",t:"Checkmate patterns",d:"Four mates every player should know.",
 intro:"Let us learn four checkmate patterns. Once you recognize them, you will spot them in real games.",
 sum:"Superb! Back-rank mate, Scholar’s mate, smothered mate, and queen and king mate. Practice them in Puzzles.",
 steps:[
 ["6k1/5ppp/8/8/8/8/5PPP/3Q2K1 w","The back-rank mate. The enemy king is stuck behind his own pawns. Use your queen to check him on the last row.","mate","Checkmate! This is why you should give your own king room to breathe.","Slide the queen up to d8."],
 ["r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq","Scholar’s mate. The weak spot is the f7 pawn, which only the king guards. Your bishop supports the queen. Capture on f7.",["h5f7"],"Checkmate! The bishop protects the queen, so the king cannot take her.","Capture the pawn on f7 with your queen."],
 ["6rk/6pp/8/6N1/8/8/8/6K1 w","The smothered mate. The king is trapped by his own rook and pawns, and a knight gives the final check. Find it.",["g5f7"],"Checkmate! A knight can check a king that has no room to move.","Jump the knight to f7."],
 ["7k/8/5KQ1/8/8/8/8/8 w","Queen and king mate. Your king guards the queen, and she covers every escape square. Deliver mate in one.",["g6g7"],"Checkmate! The queen is protected, so the king cannot capture her.","Move the queen to g7, right next to the king, protected by your own king."]]},
{id:"end",ic:"🏁",lv:"Simple endgames",t:"Winning the endgame",d:"Rook ladders and promoting a pawn.",
 intro:"In the endgame, few pieces are left, and every move counts. Let us learn how to finish the job.",
 sum:"Well done! Use rooks to push the king to the edge, and push pawns toward promotion. You are ready to practice in real games.",
 steps:[
 ["7k/R7/8/8/8/8/8/1R4K1 w","The rook ladder. One rook cuts off a whole row, and the other gives check, like climbing a ladder. Finish it.","mate","Checkmate! The two rooks work together like rungs on a ladder.","Move the second rook up to b8."],
 ["3k4/8/3K4/8/8/8/8/R7 w","King and rook against king. Your king takes away the squares in front, and the rook gives check on the edge. Deliver mate.","mate","Checkmate! Your king and rook teamed up beautifully.","Slide the rook to a8."],
 ["8/4P3/8/8/8/k7/8/4K3 w","A pawn’s big dream is promotion. When it reaches the last row, it becomes a queen! Push it forward.",["e7e8"],"Promoted! A humble pawn became the most powerful piece.","Move the pawn one square forward, to e8."]]},
{id:"special",ic:"✨",lv:"Rules you may not know",t:"Castling and en passant",d:"Two special moves that confuse almost everyone.",
 intro:"Chess has a few special moves that confuse almost every beginner. We will do two of them now.",
 sum:"Good. You castled long and captured en passant. Both only work in the right moment, so check the rules each time.",
 steps:[["4k3/8/8/8/8/8/8/R3K2R w KQ","You can castle on either side. Castling long, toward the a-file rook, puts the king on c1 and the rook on d1. Castle queenside.",["e1c1"],"Castled long. The king is tucked on c1 and the rook jumped to d1.","Move your king two squares to the left, to c1."],
 ["4k3/8/8/3pP3/8/8/8/4K3 w - d6","En passant is a pawn capture that only exists for one move. Black just pushed the d-pawn two squares, right past your pawn. You may capture it as if it had moved only one square. Capture en passant.",["e5d6"],"Captured en passant. The pawn on d5 disappears even though you landed on d6.","Move the e5 pawn diagonally to d6."]]},
{id:"trades",ic:"⚖️",lv:"Basic tactics",t:"Trades and discovered attacks",d:"Count material and use a discovered check.",
 intro:"Good players count material before every capture. Then we will meet the discovered attack.",
 sum:"Nice. Check whether a piece is protected, compare values, and look for moves that uncover an attack.",
 steps:[["4k3/8/8/3q1n2/8/8/8/3RK3 w","Pieces have values: pawn 1, knight and bishop 3, rook 5, queen 9. Win material by taking something bigger than you give up. Take the unprotected queen with your rook.",["d1d5"],"Right. A rook is worth 5 and the queen 9, and nothing protected her.","Slide the rook straight up to d5."],
 ["4k3/8/8/4b3/2N5/8/8/4K3 w","Before you capture, ask whether the piece is protected. This bishop is not, so the knight wins it for free. Take it.",["c4e5"],"Free bishop. Three points up and nothing lost.","Jump the knight from c4 to e5."],

["Threefold repetition","The same position appears three times with the same player to move. The game can be drawn."],
["Insufficient material","A draw because neither side has enough pieces to checkmate, such as king versus king or king and a lone knight or bishop versus king."],
["Touch-move","In over-the-board games, if you touch a piece you must move it. If you touch an enemy piece you must capture it."],
["Draw by agreement","Both players agree to end the game as a draw."],
["Resign","Giving up the game because you cannot win. The opponent wins."],
["Time control","The amount of time each player gets, like 10 minutes for the whole game."],
["Increment","Extra seconds added to your clock after each move."],
["Flag","Your clock “flag” falls when time runs out. Losing on time is called being flagged."],
["Bullet, blitz, rapid, classical","Time formats from fastest to slowest: bullet is about 1 minute, blitz 3 to 5, rapid 10 to 25, and classical is an hour or more per player."],
["Time trouble","Having very little time left on your clock, which often leads to blunders."],
["Elo rating","A number that measures playing strength. Beginners are often below 1000, and grandmasters are over 2500."],
["Grandmaster","The highest title in chess, earned by playing at a very high level over many games."],
["Book move","A move that experts have played so often in an opening that it is considered known theory."],
["Novelty","A new move in an opening that has not been played before in known games."],
["Transposition","Reaching the same position through a different order of moves."],
["Main line","The most popular and best known sequence of moves in an opening."],
["Variation","A different sequence of moves from the main line."],
["Repertoire","The set of openings a player chooses to play."],
["Gambit accepted","The opponent takes the pawn that was offered in a gambit."],
["Gambit declined","The opponent refuses the pawn that was offered in a gambit."],
["Queen’s Gambit","A famous opening that starts 1. d4 d5 2. c4. White offers a pawn to take over the center."],
["King’s Gambit","An aggressive opening that starts 1. e4 e5 2. f4. White offers a pawn for a fast attack."],
["Engine","A computer program that plays chess and analyzes positions. Stockfish is the best known."],
["Evaluation","A number that says who is better. Positive favors White and negative favors Black."],
["Centipawn","One hundredth of a pawn. Engines use it to score positions, so +100 means about one pawn ahead."],
["Algebraic notation","The standard way to write moves: a letter for the piece (none for pawns) and the square it goes to, like Nf3. An x means capture, + means check, and # means checkmate."],
["Annotation symbols","Marks added to moves: ! good move, !! brilliant, ? mistake, ?? blunder, !? interesting, ?! dubious."],
["Inaccuracy","A small slip. The move is not bad, but a better one was available."],
["Mistake","A move that gives away something real, like a pawn, a piece or a better position."],
["Brilliant move","A surprising and very strong move, often a sacrifice that works out."],
["Perfect move (yellow)","In your Game review, a yellow move is the best move or just as good as the best move."],
["Should have (green)","In your Game review, green shows the move you should have played instead."],
["Not this move (red)","In your Game review, red marks a move you should not have played, because it lost material or position."],
["Game review","After a win, loss or draw in Play, press Review game to step through every move, see which were perfect, and what you should have played."],
["Chess960","A chess variant where the back-row pieces start in a random order, so you cannot memorize openings."],
["Simul","A simultaneous exhibition, where one strong player plays many opponents at the same time."],
["Blindfold chess","Playing without looking at the board, keeping the whole position in your head."]];

 board(()=>S,s=>s.t,(f,t)=>{B.sel=null;if(done||S.t!="w"){B.draw();return}const m=fm(S,f,t);if(!m){B.draw();return}const a=mk(S,m);
  if(!legal(a).length&&inChk(a)){done=1;S=a;B.last=m;B.hl=[];B.draw();cfg.puz++;save();$("st").textContent="Solved! Total solved: "+cfg.puz;say("Checkmate. This was "+P[1])}
  else if(ph==2&&m2(S,m)){S=a;B.last=m;B.hl=[];B.draw();ph=1;$("st").textContent="Good. Now finish it.";say("Good. Whatever Black does, you have mate next move.");
   setTimeout(()=>{if(!$("st")||done)return;const r=pick(legal(S));S=mk(S,r);B.last=r;B.draw()},700)}
  else{B.draw();say(ph==2?"That does not force mate in two. Think about which squares the king needs, and take them away.":"Not checkmate. "+(inChk(a)?"That gives check, but the king escapes.":"That does not give check.")+" Try again, and count the king’s escape squares.")}});
 $("hint").onclick=()=>{if(done||S.t!="w")return;const m=ph==2?legal(S).find(x=>m2(S,x)):mt(S);B.hl=[m.f];B.draw();say("Look at the highlighted piece. "+(ph==2?"It has a quiet move that leaves Black no defence.":"Which square checks the king and leaves him no escape?"))};
 $("next").onclick=()=>go("puz",(n+1)%PZ.length);ctx.again=()=>say(done?"This was "+P[1]:"White to move. Find checkmate in "+(need==2?"two":"one")+".");
 say("Here is "+(daily?"today’s puzzle":"a puzzle")+". White to move. Can you find checkmate in "+(need==2?"two":"one")+"?")};
/* ---- Analysis board with commentary, engine eval, FEN and PGN loading ---- */
function pgnLoad(t){let s=init();const h=[],l=[],tk=t.replace(/\{[^}]*\}|;[^\n]*|\([^)]*\)|\[[^\]]*\]|\$\d+/g," ").replace(/\d+\.(\.\.)?/g," ").split(/\s+/).filter(x=>x&&!/^(1-0|0-1|1\/2-1\/2|\*)$/.test(x));
 for(const x of tk){const c=x.replace(/[+#!?]/g,""),m=legal(s).find(y=>san(s,y).replace(/[+#]/g,"")==c);if(!m)throw 0;h.push(s);l.push(san(s,m));s=mk(s,m)}return{s,h,l}}
VW.ana=()=>{let hist=[],ml=[],fw=[];S=init();
 shell('<div class="card"><h3>Analysis board</h3><div class="evb"><i id="ev"></i></div><small id="evt" style="color:var(--dm)"></small><div class="row"><button class="bt" id="best">Best move</button><button class="bt" id="undo">Undo</button><button class="bt" id="fw">Forward</button><button class="bt" id="rvw">Review</button><button class="bt" id="flip">Flip</button><button class="bt" id="rst">Reset</button></div><textarea id="fenb" rows="2" aria-label="FEN"></textarea><div class="row"><button class="bt" id="lf">Load FEN</button><button class="bt" id="lp">Load PGN</button></div><textarea id="pgn" rows="3" placeholder="Paste a PGN here, then press Load PGN" aria-label="PGN"></textarea><div class="mvs" id="mv"></div></div>');
 const upd=()=>{B.draw();$("fenb").value=toFen(S);const t=[];for(let i=0;i<ml.length;i+=2)t.push((i/2+1)+". "+ml[i]+" "+(ml[i+1]||""));$("mv").textContent=t.join("  ");
  const e=(S.t=="w"?1:-1)*ab(S,2,-1e9,1e9)/100;$("ev").style.width=50+Math.max(-45,Math.min(45,e*9))+"%";$("evt").textContent="Evaluation: "+(Math.abs(e)>900?"mate in sight":(e>0?"+":"")+e.toFixed(1))+" (positive favors White)"};
 board(()=>S,s=>s.t,(f,t)=>{B.sel=null;const m=fm(S,f,t);if(!m){B.draw();return}const w=S.t=="w"?"White":"Black",tx=w+" plays "+mvs(m)+". It "+explain(S,m,hist.length)+".";
  hist.push(S);ml.push(san(S,m));S=mk(S,m);fw=[];B.last=m;B.hl=[];upd();say(tx)});
 $("best").onclick=()=>{if(!legal(S).length)return;const m=scoreMoves(S,2)[0].m;B.hl=[m.f,m.t];B.draw();say("The best move here is "+mvs(m)+". It "+explain(S,m,hist.length)+".")};
 $("undo").onclick=()=>{if(!hist.length)return;fw.push([S,ml[ml.length-1]]);S=hist.pop();ml.pop();B.last=null;B.hl=[];upd()};
 $("fw").onclick=()=>{if(!fw.length)return;const[t0,sn]=fw.pop();hist.push(S);ml.push(sn);S=t0;B.last=null;B.hl=[];upd()};
 $("rvw").onclick=()=>{if(!hist.length){say("Play or load some moves first.");return}$("mv").textContent="Reviewing...";setTimeout(()=>{const out=[];hist.forEach((q,k)=>{const m=legal(q).find(x=>san(q,x)==ml[k]),L=scoreMoves(q,3),me2=L.find(x=>x.m.f==m.f&&x.m.t==m.t),loss=L[0].v-me2.v;if(loss>=150)out.push((k/2+1|0)+(q.t=="w"?". ":"... ")+ml[k]+(loss>=300?"??":"?")+" (better: "+san(q,L[0].m)+")")});$("mv").textContent=out.length?"Mistakes: "+out.join("  ·  "):"No big mistakes found.";say(out.length?"I found "+out.length+(out.length>1?" mistakes":" mistake")+". They are listed under the board.":"I did not find any big mistakes.")},50)};
 $("flip").onclick=()=>{B.flip=!B.flip;B.draw()};$("rst").onclick=()=>{S=init();hist=[];ml=[];B.last=null;B.hl=[];upd()};
 $("lf").onclick=()=>{try{S=fen($("fenb").value.trim());hist=[];ml=[];B.last=null;B.hl=[];upd();say("Position loaded. Make a move, or ask for the best move.")}catch(e){say("I could not read that FEN. Please check it.")}};
 $("lp").onclick=()=>{try{const r=pgnLoad($("pgn").value);S=r.s;hist=r.h;ml=r.l;B.last=null;B.hl=[];upd();say("Game loaded with "+ml.length+" moves. Use Undo to step back, and I will comment on any move you play.")}catch(e){say("I could not read that PGN. Make sure the moves are in standard notation.")}};
 upd();say("This is the analysis board. Move any piece for either side, and I will explain each move. Paste a FEN or a PGN below to study a position.")};
/* ---- Progress, badges, settings ---- */
const BD=[["🌱","First Steps",()=>cfg.done.includes("pieces")],["⚔️","Rule Keeper",()=>cfg.done.includes("rules")],["🎯","Tactician",()=>cfg.done.includes("tactics")],["🚪","Opening Pro",()=>cfg.done.includes("open")],["👑","Mate Maker",()=>cfg.done.includes("mates")],["🏁","Endgame Hero",()=>cfg.done.includes("end")],["🧩","Puzzle Solver",()=>cfg.puz>=3],["♟","First Game",()=>cfg.games>=1],["👁️","Sharp Eyes",()=>cfg.cbest>=20],["🏅","First Win",()=>(cfg.wl||[0])[0]>=1],["🔥","3 Day Streak",()=>cfg.streak>=3],["❓","Quiz Whiz",()=>cfg.qbest>=8],["🎞️","Historian",()=>cfg.games>=1&&cfg.qbest>=1],["📚","Scholar",()=>cfg.done.length>=LS.length]];
VW.prog=()=>{const d=cfg.done.length,wl=cfg.wl||[0,0,0],xp=d*50+cfg.puz*10+wl[0]*30,lvl=Math.floor(Math.sqrt(xp/20))+1;app.innerHTML='<div class="page"><h1>Your progress</h1><div class="card"><b>'+d+' of '+LS.length+' lessons complete</b><div class="prog"><i style="width:'+d/LS.length*100+'%"></i></div><p style="color:var(--dm);margin:0">Puzzles solved: '+cfg.puz+' · Games played: '+cfg.games+' · Best coordinate score: '+(cfg.cbest|0)+' · Best quiz: '+(cfg.qbest|0)+'/10</p><p style="color:var(--dm);margin:.3rem 0 0">Record: '+wl[0]+' wins, '+wl[1]+' losses, '+wl[2]+' draws · Level '+lvl+' ('+xp+' XP) · Day streak '+(cfg.streak|0)+'</p></div><h2 style="margin-top:1.2rem">Badges</h2><div class="badges">'+BD.map(b=>'<div class="bg'+(b[2]()?" on":"")+'"><span>'+b[0]+'</span><div>'+b[1]+'</div></div>').join("")+'</div></div>'};
VW.set=()=>{app.innerHTML='<div class="page"><h1>Settings</h1><div class="card form"><label><input type="checkbox" id="sv"> Voice teacher on</label><label>Coach voice style <select id="vst">'+VST.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join("")+'</select></label><label>Device voice <select id="vs"></select></label><label>Pitch <input type="range" id="sp" min="0.7" max="1.3" step="0.05"></label><label>Speech speed <input type="range" id="sr" min="0.6" max="1.4" step="0.1"> <span id="srv"></span></label><label>Promote pawns to <select id="pm"><option value="Q">Queen</option><option value="R">Rook</option><option value="B">Bishop</option><option value="N">Knight</option></select></label><label><input type="checkbox" id="sn"> Move sounds</label><label>Theme <select id="th"><option value="dark">Dark</option><option value="light">Light</option></select></label><label>Board colors <select id="bc"><option value="green">Green</option><option value="brown">Brown</option><option value="blue">Blue</option><option value="purple">Purple</option><option value="gray">Gray</option><option value="red">Red</option></select></label><div class="row"><button class="bt" id="tv">Test voice</button><button class="bt" id="rp">Reset progress</button></div></div></div>';
 $("sv").checked=cfg.voice;$("sr").value=cfg.rate;$("srv").textContent=cfg.rate+"x";$("th").value=cfg.theme;$("bc").value=cfg.bc;
 $("sv").onchange=e=>{cfg.voice=e.target.checked;save();look()};$("sr").oninput=e=>{cfg.rate=+e.target.value;$("srv").textContent=cfg.rate+"x";save()};
 $("th").onchange=e=>{cfg.theme=e.target.value;save();look()};$("bc").onchange=e=>{cfg.bc=e.target.value;save();look()};
 $("pm").value=cfg.promo||"Q";$("sn").checked=!!cfg.sound;$("pm").onchange=e=>{cfg.promo=e.target.value;save()};$("sn").onchange=e=>{cfg.sound=e.target.checked;save()};window.fillV=()=>{const e=$("vs");if(!e)return;const b=bestV();e.innerHTML='<option value="">Automatic'+(b?" ("+b.name+")":"")+'</option>'+VOICES.map(v=>"<option value=\""+v.name.replace(/"/g,"")+"\">"+v.name+" · "+v.lang+"</option>").join("");e.value=VOICES.some(v=>v.name==cfg.vname)?cfg.vname:""};fillV();$("vs").onchange=e=>{cfg.vname=e.target.value;save();say("Hello, I am Coach King. This is how I sound.")};$("vst").value=vst()[0];$("vst").onchange=e=>{cfg.vstyle=e.target.value;save();say("Hello, I am Coach King. This is my "+vst()[1].replace(/[^a-zA-Z ]/g,"").replace("default","").trim().toLowerCase()+" voice.")};$("sp").value=cfg.pitch||1;$("sp").oninput=e=>{cfg.pitch=+e.target.value;save()};$("sp").onchange=()=>say("This is my pitch.");$("tv").onclick=()=>say("Hello! I am Coach King. Let us learn chess together.");$("rp").onclick=()=>{cfg.done=[];cfg.puz=0;cfg.games=0;cfg.cbest=0;cfg.qbest=0;cfg.quizzes=0;cfg.wl=[0,0,0];cfg.streak=0;save();say("Progress reset.")}};
$("vbtn").onclick=()=>{cfg.voice=!cfg.voice;save();look();if(!cfg.voice)shush()};$("home").onclick=()=>go("learn");
const day=Math.floor(Date.now()/864e5);if(cfg.last!=day){cfg.streak=cfg.last==day-1?(cfg.streak|0)+1:1;cfg.last=day;save()}
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const c=k=>{const b=$(k);if(b)b.click()};if(e.key=="ArrowRight"){c("of");c("fw");c("rnx")}if(e.key=="ArrowLeft"){c("ob");if($("fw"))c("undo");c("rpv")}if(e.key=="f")c("flip")});
look();go("learn");setTimeout(()=>$("splash").classList.add("off"),900);
</script>
